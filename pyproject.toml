[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinymongo"
version = "1.3.0"
description = "Embedded MongoDB-compatible database with sync, async, and multi-backend storage"
readme = "README.md"
requires-python = ">=3.9"
authors = [ { name = "Stephen Chapman", email = "schapman1974@gmail.com" } ]
license = "MIT"
license-files = ["LICENSE.txt"]
dependencies = [
  "tinydb>=3.2.1,<4",
  "portalocker>=2.7.0"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://tinymongo.org/"
Source = "https://github.com/schapman1974/tinymongo"
Roadmap = "https://github.com/schapman1974/tinymongo/blob/master/ROADMAP.md"

[project.scripts]
tinymongo = "tinymongo.cli:main"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.9"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q -m 'not integration and not mongodb and not legacy_mongodb'"
markers = [
  "contract: shared application-facing compatibility contracts",
  "client_options: configure PyMongo-shaped clients for a shared contract",
  "integration: opt-in integration and stress tests that may be slower or resource intensive",
  "legacy_mongodb: quarantined MongoDB comparisons retained only during contract migration",
  "mongodb: requires a real MongoDB server selected through TINYMONGO_MONGODB_URI",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tinymongo*"]

[tool.setuptools]
include-package-data = true

[project.optional-dependencies]
serialization = ["tinydb-serialization>=1.0.4,<2"]
bson = ["pymongo>=4.9"]
pymongo = ["pymongo>=4.9"]
duckdb = ["duckdb>=1.0.0"]
parquet = ["duckdb>=1.0.0", "pyarrow>=10.0.0"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
mariadb = ["PyMySQL>=1.1"]
remote-sql = ["psycopg[binary]>=3.1", "PyMySQL>=1.1"]
# PEP 508 has no free-threaded ABI marker. This profile uses pure Psycopg and
# omits DuckDB/Parquet until those projects publish compatible distributions.
free-threaded = [
  "tinydb-serialization>=1.0.4,<2",
  "pymongo>=4.15.2",
  "psycopg>=3.3.4",
  "PyMySQL>=1.1",
]
all = [
  "tinydb-serialization>=1.0.4,<2",
  "pymongo>=4.9",
  "duckdb>=1.0.0",
  "pyarrow>=10.0.0",
  "psycopg[binary]>=3.1",
  "PyMySQL>=1.1",
]
