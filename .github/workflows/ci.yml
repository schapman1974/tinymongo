name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Install system deps (libexpat) # ensure xml parser available
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install .

      - name: Run tests
        run: pytest -q

      - name: Lint
        run: |
          pip install black ruff mypy
          ruff check .
          black --check . || true
          mypy --ignore-missing-imports tinymongo || true
