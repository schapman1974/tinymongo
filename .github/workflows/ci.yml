name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  core-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install only core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest .

      - name: Verify optional BSON dependencies are absent
        run: >-
          python -c "import importlib.util;
          assert importlib.util.find_spec('pymongo') is None;
          assert importlib.util.find_spec('bson') is None"

      - name: Run dependency-free BSON and CLI tests
        run: >-
          pytest -o addopts='' -q
          tests/test_bson_registry_hardening.py tests/test_cli.py
          tests/test_client_configuration.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Install system deps (libexpat) # ensure xml parser available
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ".[all]"

      - name: Run tests
        if: matrix.python-version != '3.14'
        run: python -m pytest

      - name: Run tests with canonical coverage
        if: matrix.python-version == '3.14'
        run: |
          coverage run --branch -m pytest
          coverage report --include='tinymongo/*' --fail-under=100

      - name: Lint
        if: matrix.python-version == '3.14'
        run: |
          ruff check .
          black --check .
          mypy --ignore-missing-imports tinymongo

  free-threaded:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up free-threaded Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14t'
          check-latest: true
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-free-threaded.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev libpq-dev

      - name: Install free-threaded dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-free-threaded.txt
          pip install ".[free-threaded]"

      - name: Verify dependencies preserve free-threaded execution
        run: |
          python - <<'PY'
          import sys
          import sysconfig

          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert sys._is_gil_enabled() is False

          import coverage.tracer
          import mongoengine
          import mypy.main
          import portalocker
          import psycopg
          import pyarrow
          import pymongo
          import pymysql
          import tinydb_serialization
          import tinymongo

          assert psycopg.pq.__impl__ == "python"
          assert sys._is_gil_enabled() is False
          PY

      - name: Force GIL-disabled test execution
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Run supported free-threaded suite
        run: |
          coverage run --branch -m pytest \
            --ignore=tests/test_table_backends.py \
            -k 'not duckdb and not parquet'
          coverage report --include='tinymongo/*' --fail-under=85

  mongodb-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            free-threaded: false
            artifact-suffix: py311
          - python-version: '3.14'
            free-threaded: false
            artifact-suffix: py314
          - python-version: '3.14t'
            free-threaded: true
            artifact-suffix: py314t
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TINYMONGO_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
      TINYMONGO_REQUIRE_MONGODB: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          cache: pip

      - name: Install standard contract dependencies
        if: ${{ !matrix.free-threaded }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ".[all]"

      - name: Install free-threaded MongoDB dependencies
        if: matrix.free-threaded
        run: |
          python -m pip install --upgrade pip
          pip install pytest "pymongo>=4.15.2" .

      - name: Verify free-threaded MongoDB dependencies
        if: matrix.free-threaded
        run: |
          python - <<'PY'
          import sys
          import sysconfig

          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert sys._is_gil_enabled() is False

          import pymongo
          import tinymongo

          assert sys._is_gil_enabled() is False
          PY

      - name: Force GIL-disabled contract execution
        if: matrix.free-threaded
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Run real MongoDB compatibility contracts
        if: ${{ !matrix.free-threaded }}
        run: >-
          pytest -o addopts='' -q -m contract tests/contracts
          --junitxml=contract-results.xml

      - name: Run free-threaded MongoDB compatibility contracts
        if: matrix.free-threaded
        run: >-
          pytest -o addopts='' -q -m 'contract and mongodb' tests/contracts
          --junitxml=contract-results.xml

      - name: Generate compatibility reports
        if: always()
        run: |
          if [ -f contract-results.xml ]; then
            python scripts/generate_compatibility_report.py contract-results.xml \
              --json-output compatibility-report.json \
              --markdown-output compatibility-report.md
            cat compatibility-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Contract JUnit output was not created; reports cannot be generated"
          fi

      - name: Upload compatibility results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-compatibility-results-${{ matrix.artifact-suffix }}
          path: |
            contract-results.xml
            compatibility-report.json
            compatibility-report.md
          if-no-files-found: warn

  remote-sql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            free-threaded: false
          - python-version: '3.14'
            free-threaded: false
          - python-version: '3.14t'
            free-threaded: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tinymongo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tinymongo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: mariadb
          MARIADB_DATABASE: tinymongo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TINYMONGO_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/tinymongo
      TINYMONGO_MYSQL_DSN: mysql://root:mariadb@127.0.0.1:3306/tinymongo

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          cache: pip

      - name: Install libpq for pure Psycopg
        if: matrix.free-threaded
        run: sudo apt-get update && sudo apt-get install -y libpq5

      - name: Install standard remote SQL test dependencies
        if: ${{ !matrix.free-threaded }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest ".[remote-sql,bson]"

      - name: Install free-threaded remote SQL test dependencies
        if: matrix.free-threaded
        run: |
          python -m pip install --upgrade pip
          pip install pytest ".[free-threaded]"

      - name: Verify free-threaded remote SQL dependencies
        if: matrix.free-threaded
        run: |
          python - <<'PY'
          import sys
          import sysconfig

          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert sys._is_gil_enabled() is False

          import psycopg
          import pymysql
          import tinymongo

          assert psycopg.pq.__impl__ == "python"
          assert sys._is_gil_enabled() is False
          PY

      - name: Force GIL-disabled integration execution
        if: matrix.free-threaded
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Run PostgreSQL and MariaDB integration tests
        run: pytest -o addopts='' -q -m integration tests/integration/test_remote_sql.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          check-latest: true

      - name: Install package tools
        run: |
          python -m pip install --upgrade pip
          pip install "build>=1.3" "twine>=7"

      - name: Build and verify distributions
        run: |
          python -m build
          python -m twine check --strict dist/*

      - name: Install the built wheel
        run: pip install --force-reinstall dist/*.whl

      - name: Smoke-test installed package
        working-directory: ${{ runner.temp }}
        run: python -c "import tinymongo; print(tinymongo.__file__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: tinymongo-dist
          path: dist/*
          if-no-files-found: error

  platform-wheel:
    name: platform-wheel (${{ matrix.profile }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.14'
            profile: linux-x64-current
            extras: all
            smoke-extras: bson,duckdb,parquet,remote-sql,serialization
            all-backends: true
            free-threaded: false
            source-test-args: ''
          - os: ubuntu-latest
            python-version: '3.14t'
            profile: linux-x64-free-threaded
            extras: free-threaded
            smoke-extras: bson,remote-sql,serialization
            all-backends: false
            free-threaded: true
            source-test-args: ''
          - os: windows-latest
            python-version: '3.9'
            profile: windows-x64-minimum
            extras: ''
            smoke-extras: ''
            all-backends: false
            free-threaded: false
            source-test-args: ''
          - os: windows-latest
            python-version: '3.14'
            profile: windows-x64-current
            extras: all
            smoke-extras: bson,duckdb,parquet,remote-sql,serialization
            all-backends: true
            free-threaded: false
            # TODO(#81): remove after Parquet encodes portable physical names.
            source-test-args: >-
              --deselect=tests/test_durable_indexes.py::test_catalog_identity_cannot_collide_across_collection_and_index_names[parquet]
          - os: macos-15-intel
            python-version: '3.9'
            profile: macos-x64-minimum
            extras: ''
            smoke-extras: ''
            all-backends: false
            free-threaded: false
            source-test-args: ''
          - os: macos-latest
            python-version: '3.14'
            profile: macos-arm64-current
            extras: all
            smoke-extras: bson,duckdb,parquet,remote-sql,serialization
            all-backends: true
            free-threaded: false
            source-test-args: ''
    env:
      TINYMONGO_WHEEL_EXTRAS: ${{ matrix.extras }}
      TINYMONGO_INTEGRATION_BACKEND: sqlite
      TINYMONGO_INTEGRATION_PROCS: '4'
      TINYMONGO_INTEGRATION_WRITES_PER_PROC: '10'
      TINYMONGO_INTEGRATION_SINGLE_PROCS: '4'
      TINYMONGO_INTEGRATION_SINGLE_WRITES_PER_PROC: '5'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the universal wheel
        uses: actions/download-artifact@v4
        with:
          name: tinymongo-dist
          path: dist

      - name: Upgrade the package installer
        run: python -m pip install --upgrade pip

      - name: Install the built wheel
        run: >-
          python -c "import os, pathlib, subprocess, sys;
          wheel = next(pathlib.Path('dist').glob('*.whl'));
          extras = os.environ['TINYMONGO_WHEEL_EXTRAS'];
          requirement = ('tinymongo[' + extras + '] @ ' +
          wheel.resolve().as_uri()) if extras else str(wheel);
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--force-reinstall', requirement])"

      - name: Install platform test runner
        run: python -m pip install pytest

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Force GIL-disabled wheel validation
        if: matrix.free-threaded
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Verify the wheel preserves free-threaded execution
        if: matrix.free-threaded
        run: >-
          python -c "import sys, sysconfig;
          assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1;
          assert sys._is_gil_enabled() is False;
          import psycopg, pymongo, pymysql, tinymongo;
          assert psycopg.pq.__impl__ == 'python';
          assert sys._is_gil_enabled() is False"

      - name: Smoke-test the installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -I "${{ github.workspace }}/scripts/verify_installed_package.py"
          --require-installed-wheel --extras "${{ matrix.smoke-extras }}"

      - name: Verify the installed console entry point
        run: tinymongo --help

      - name: Run focused portable suite with every local backend
        if: matrix.all-backends
        run: >-
          python -m pytest -o addopts='' -q
          tests/test_async_api.py
          tests/test_bson_registry_hardening.py
          tests/test_cli.py
          tests/test_cli_replacement_safety.py
          tests/test_client_configuration.py
          tests/test_client_read_fidelity.py
          tests/test_common_api.py
          tests/test_durable_indexes.py
          tests/test_multi_write.py
          tests/test_projection_memory.py
          tests/test_sqlite_bulk_updates.py
          tests/test_sqlite_complex_read_candidates.py
          tests/test_sqlite_optimistic_inserts.py
          tests/test_sqlite_read_optimizations.py
          tests/test_sharded_sqlite_backend.py
          tests/test_sharded_sqlite_concurrency.py
          tests/test_sharded_sqlite_coverage_init.py
          tests/test_sharded_sqlite_coverage_mutations.py
          tests/test_sharded_sqlite_operation_atomicity.py
          tests/test_sharded_sqlite_point_read_optimizations.py
          tests/test_storage_backends.py
          tests/test_thread_safety.py
          tests/test_typed_physical_ids.py
          ${{ matrix.source-test-args }}

      - name: Run focused portable core suite
        if: ${{ !matrix.all-backends }}
        run: >-
          python -m pytest -o addopts='' -q
          tests/test_async_api.py
          tests/test_bson_registry_hardening.py
          tests/test_cli.py
          tests/test_cli_replacement_safety.py
          tests/test_client_configuration.py
          tests/test_common_api.py
          tests/test_durable_indexes.py
          tests/test_multi_write.py
          tests/test_projection_memory.py
          tests/test_sqlite_bulk_updates.py
          tests/test_sqlite_complex_read_candidates.py
          tests/test_sqlite_optimistic_inserts.py
          tests/test_sqlite_read_optimizations.py
          tests/test_storage_backends.py
          tests/test_thread_safety.py
          -k "not duckdb and not parquet"
          ${{ matrix.source-test-args }}

      - name: Run reduced cross-process SQLite locking smoke
        run: >-
          python -m pytest -o addopts='' -q -m integration
          tests/integration/test_concurrent_writes.py

      - name: Run reduced cross-process Sharded SQLite locking smoke
        env:
          TINYMONGO_INTEGRATION_BACKEND: sqlite-sharded
        run: >-
          python -m pytest -o addopts='' -q -m integration
          tests/integration/test_concurrent_writes.py

  pymongo-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install minimum supported PyMongo
        run: |
          python -m pip install --upgrade pip
          pip install pytest "pymongo==4.9.*" .

      - name: Run PyMongo and BSON compatibility tests
        run: >-
          pytest -o addopts='' -q
          tests/test_patching.py tests/test_bson_codec.py
          tests/test_insert_many_semantics.py tests/test_talkpython_regressions.py
          tests/test_client_configuration.py tests/test_client_read_fidelity.py
          -k 'not duckdb and not parquet'
