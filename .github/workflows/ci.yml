name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Install system deps (libexpat) # ensure xml parser available
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ".[all]"

      - name: Run tests
        run: |
          coverage run --branch -m pytest
          coverage report --include='tinymongo/*' --fail-under=100

      - name: Lint
        run: |
          ruff check .
          black --check .
          mypy --ignore-missing-imports tinymongo

  mongodb-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TINYMONGO_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
      TINYMONGO_REQUIRE_MONGODB: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ".[all]"

      - name: Run real MongoDB compatibility contracts
        run: >-
          pytest -o addopts='' -q -m contract tests/contracts
          --junitxml=contract-results.xml

      - name: Generate compatibility reports
        if: always()
        run: |
          if [ -f contract-results.xml ]; then
            python scripts/generate_compatibility_report.py contract-results.xml \
              --json-output compatibility-report.json \
              --markdown-output compatibility-report.md
          else
            echo "::warning::Contract JUnit output was not created; reports cannot be generated"
          fi

      - name: Upload compatibility results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-compatibility-results
          path: |
            contract-results.xml
            compatibility-report.json
            compatibility-report.md
          if-no-files-found: warn

  remote-sql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tinymongo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tinymongo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: mariadb
          MARIADB_DATABASE: tinymongo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TINYMONGO_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/tinymongo
      TINYMONGO_MYSQL_DSN: mysql://root:mariadb@127.0.0.1:3306/tinymongo

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install remote SQL test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ".[remote-sql]"

      - name: Run PostgreSQL and MariaDB integration tests
        run: pytest -o addopts='' -q -m integration tests/integration/test_remote_sql.py

  pymongo-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install minimum supported PyMongo
        run: |
          python -m pip install --upgrade pip
          pip install pytest "pymongo==4.9.*" .

      - name: Run PyMongo and BSON compatibility tests
        run: >-
          pytest -o addopts='' -q
          tests/test_patching.py tests/test_bson_codec.py
