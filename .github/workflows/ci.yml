name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Install system deps (libexpat) # ensure xml parser available
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ".[all]"

      - name: Run tests
        run: |
          coverage run --branch -m pytest
          coverage report --include='tinymongo/*' --fail-under=100

      - name: Lint
        run: |
          ruff check .
          black --check .
          mypy --ignore-missing-imports tinymongo
