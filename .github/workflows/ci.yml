name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  core-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install only core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest .

      - name: Verify optional BSON dependencies are absent
        run: >-
          python -c "import importlib.util;
          assert importlib.util.find_spec('pymongo') is None;
          assert importlib.util.find_spec('bson') is None"

      - name: Run dependency-free BSON and CLI tests
        run: >-
          pytest -o addopts='' -q
          tests/test_bson_registry_hardening.py tests/test_cli.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Install system deps (libexpat) # ensure xml parser available
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ".[all]"

      - name: Run tests
        run: |
          coverage run --branch -m pytest
          coverage report --include='tinymongo/*' --fail-under=100

      - name: Lint
        if: matrix.python-version == '3.14'
        run: |
          ruff check .
          black --check .
          mypy --ignore-missing-imports tinymongo

  free-threaded:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up free-threaded Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14t'
          check-latest: true
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-free-threaded.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev libpq-dev

      - name: Install free-threaded dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-free-threaded.txt
          pip install ".[free-threaded]"

      - name: Verify dependencies preserve free-threaded execution
        run: |
          python - <<'PY'
          import sys
          import sysconfig

          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert sys._is_gil_enabled() is False

          import coverage.tracer
          import mongoengine
          import mypy.main
          import portalocker
          import psycopg
          import pyarrow
          import pymongo
          import pymysql
          import tinydb_serialization
          import tinymongo

          assert psycopg.pq.__impl__ == "python"
          assert sys._is_gil_enabled() is False
          PY

      - name: Force GIL-disabled test execution
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Run supported free-threaded suite
        run: |
          coverage run --branch -m pytest \
            --ignore=tests/test_table_backends.py \
            -k 'not duckdb and not parquet'
          coverage report --include='tinymongo/*' --fail-under=85

  mongodb-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            free-threaded: false
            artifact-suffix: py311
          - python-version: '3.14'
            free-threaded: false
            artifact-suffix: py314
          - python-version: '3.14t'
            free-threaded: true
            artifact-suffix: py314t
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TINYMONGO_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
      TINYMONGO_REQUIRE_MONGODB: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          cache: pip

      - name: Install standard contract dependencies
        if: ${{ !matrix.free-threaded }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ".[all]"

      - name: Install free-threaded MongoDB dependencies
        if: matrix.free-threaded
        run: |
          python -m pip install --upgrade pip
          pip install pytest "pymongo>=4.15.2" .

      - name: Verify free-threaded MongoDB dependencies
        if: matrix.free-threaded
        run: |
          python - <<'PY'
          import sys
          import sysconfig

          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert sys._is_gil_enabled() is False

          import pymongo
          import tinymongo

          assert sys._is_gil_enabled() is False
          PY

      - name: Force GIL-disabled contract execution
        if: matrix.free-threaded
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Run real MongoDB compatibility contracts
        if: ${{ !matrix.free-threaded }}
        run: >-
          pytest -o addopts='' -q -m contract tests/contracts
          --junitxml=contract-results.xml

      - name: Run free-threaded MongoDB compatibility contracts
        if: matrix.free-threaded
        run: >-
          pytest -o addopts='' -q -m 'contract and mongodb' tests/contracts
          --junitxml=contract-results.xml

      - name: Generate compatibility reports
        if: always()
        run: |
          if [ -f contract-results.xml ]; then
            python scripts/generate_compatibility_report.py contract-results.xml \
              --json-output compatibility-report.json \
              --markdown-output compatibility-report.md
            cat compatibility-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Contract JUnit output was not created; reports cannot be generated"
          fi

      - name: Upload compatibility results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-compatibility-results-${{ matrix.artifact-suffix }}
          path: |
            contract-results.xml
            compatibility-report.json
            compatibility-report.md
          if-no-files-found: warn

  remote-sql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            free-threaded: false
          - python-version: '3.14'
            free-threaded: false
          - python-version: '3.14t'
            free-threaded: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tinymongo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tinymongo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: mariadb
          MARIADB_DATABASE: tinymongo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TINYMONGO_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/tinymongo
      TINYMONGO_MYSQL_DSN: mysql://root:mariadb@127.0.0.1:3306/tinymongo

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          cache: pip

      - name: Install libpq for pure Psycopg
        if: matrix.free-threaded
        run: sudo apt-get update && sudo apt-get install -y libpq5

      - name: Install standard remote SQL test dependencies
        if: ${{ !matrix.free-threaded }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest ".[remote-sql,bson]"

      - name: Install free-threaded remote SQL test dependencies
        if: matrix.free-threaded
        run: |
          python -m pip install --upgrade pip
          pip install pytest ".[free-threaded]"

      - name: Verify free-threaded remote SQL dependencies
        if: matrix.free-threaded
        run: |
          python - <<'PY'
          import sys
          import sysconfig

          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert sys._is_gil_enabled() is False

          import psycopg
          import pymysql
          import tinymongo

          assert psycopg.pq.__impl__ == "python"
          assert sys._is_gil_enabled() is False
          PY

      - name: Force GIL-disabled integration execution
        if: matrix.free-threaded
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Run PostgreSQL and MariaDB integration tests
        run: pytest -o addopts='' -q -m integration tests/integration/test_remote_sql.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.14'
            artifact-name: tinymongo-dist-py314
          - python-version: '3.14t'
            artifact-name: tinymongo-dist-py314t

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Install package tools
        run: |
          python -m pip install --upgrade pip
          pip install "build>=1.3" "twine>=7"

      - name: Build and verify distributions
        run: |
          python -m build
          python -m twine check --strict dist/*

      - name: Install the built wheel
        run: pip install --force-reinstall dist/*.whl

      - name: Smoke-test installed package
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import sys
          import sysconfig
          import tinymongo

          if sysconfig.get_config_var("Py_GIL_DISABLED"):
              assert sys._is_gil_enabled() is False
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/*
          if-no-files-found: error

  pymongo-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install minimum supported PyMongo
        run: |
          python -m pip install --upgrade pip
          pip install pytest "pymongo==4.9.*" .

      - name: Run PyMongo and BSON compatibility tests
        run: >-
          pytest -o addopts='' -q
          tests/test_patching.py tests/test_bson_codec.py
          tests/test_insert_many_semantics.py tests/test_talkpython_regressions.py
          -k 'not duckdb and not parquet'
